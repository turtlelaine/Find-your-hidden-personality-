<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Test: Find Your Digital Persona</title>
    <meta name="description" content="A 3-minute quiz to discover your Digital Persona.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F5;
            --bg-card: #FFFFFF;
            --bg-well: #EBEBEB;
            --ink: #1A1A1A;
            --ink-soft: #555555;
            --ink-faint: #999999;
            --accent: #222222;
            --accent-ink: #FFFFFF;
            --accent-soft: #E0E0E0;
            --accent-2: #666666;
            --line: #CCCCCC;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, .35);
            --font-display: 'Baloo 2', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --dur: .35s;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
        }
        body.cold {
            --bg: #121212;
            --bg-card: #1E1E1E;
            --bg-well: #2A2A2A;
            --ink: #EEEEEE;
            --ink-soft: #AAAAAA;
            --ink-faint: #777777;
            --accent: #DDDDDD;
            --accent-ink: #121212;
            --accent-soft: #333333;
            --accent-2: #999999;
            --line: #444444;
            --shadow: 0 24px 70px -24px rgba(0, 0, 0, .7);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            min-height: 100vh;
            transition: background-color .2s ease, color .2s ease;
            overflow-x: hidden;
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
        }

        body.dark-screen {
            background-color: #0A0006;
            color: #FF2222;
        }
        body.dark-screen .topbar { background: linear-gradient(to bottom, #0A0006 70%, transparent); }
        body.dark-screen .wordmark { color: #FF2222; }
        body.dark-screen .progress-track { background-color: #1a0507; }
        body.dark-screen .progress-fill { background: linear-gradient(90deg, #FF2222, #880000); }
        body.dark-screen .step-count { color: #B33; }

        body.q7x-slow-dark {
            background-color: #0A0006;
            color: #FF2222;
            transition: background-color 10s linear, color 10s linear;
        }
        body.q7x-slow-dark .topbar {
            background: linear-gradient(to bottom, #0A0006 70%, transparent);
            transition: background 10s linear;
        }
        body.q7x-slow-dark .wordmark { color: #FF2222; transition: color 10s linear; }
        body.q7x-slow-dark .progress-track { background-color: #1a0507; transition: background-color 10s linear; }
        body.q7x-slow-dark .progress-fill { background: linear-gradient(90deg, #FF2222, #880000); transition: background 10s linear; }
        body.q7x-slow-dark .step-count { color: #B33; transition: color 10s linear; }

        body.loading-dark {
            background-color: #0A0006;
            color: #FF2222;
            transition: background-color .08s ease, color .08s ease;
        }
        body.loading-dark .topbar { background: linear-gradient(to bottom, #0A0006 70%, transparent); transition: background .08s ease; }
        body.loading-dark .wordmark { color: #FF2222; transition: color .08s ease; }
        body.loading-dark .progress-track { background-color: #1a0507; transition: background-color .08s ease; }
        body.loading-dark .progress-fill { background: linear-gradient(90deg, #FF2222, #880000); transition: background .08s ease; }
        body.loading-dark .step-count { color: #B33; transition: color .08s ease; }

        body.true-ending-dark {
            background-color: #0A0006;
            color: #FF2222;
            transition: background-color .5s ease, color .5s ease;
        }
        body.true-ending-dark .topbar { background: linear-gradient(to bottom, #0A0006 70%, transparent); }
        body.true-ending-dark .wordmark { color: #FF2222; }
        body.true-ending-dark .progress-track { background-color: #1a0507; }
        body.true-ending-dark .progress-fill { background: linear-gradient(90deg, #FF2222, #880000); }
        body.true-ending-dark .step-count { color: #B33; }

        .card.q7x-slow-dark {
            background-color: #0A0006;
            color: #FF2222;
            box-shadow: inset 0 0 60px rgba(255, 59, 59, .35), var(--shadow);
            transition: background-color 10s linear, color 10s linear, box-shadow 10s linear;
        }
        .card.q7x-slow-dark h2,
        .card.q7x-slow-dark p { color: #FF2222; transition: color 10s linear; }
        .card.q7x-slow-dark .icon-badge { background-color: #1a0507; color: #FF2222; transition: background-color 10s linear, color 10s linear; }
        .card.q7x-slow-dark .option {
            background-color: #0A0006; color: #FF2222; border-color: #441111;
            transition: background-color 10s linear, color 10s linear, border-color 10s linear;
        }
        .card.q7x-slow-dark .option:hover { border-color: #FF2222; }
        .card.q7x-slow-dark .countdown { color: #B33; transition: color 10s linear; }

        .card.q10-dark {
            background-color: #0A0006; color: #FF2222;
            box-shadow: inset 0 0 60px rgba(255, 59, 59, .55), var(--shadow);
        }
        .card.q10-dark h2,
        .card.q10-dark p,
        .card.q10-dark .icon-badge { color: #FF2222; }
        .card.q10-dark .icon-badge { background-color: #1a0507; }
        .card.q10-dark .option { background-color: #0A0006; color: #FF2222; border-color: #441111; }
        .card.q10-dark .option:hover { border-color: #FF2222; }

        .topbar {
            position: sticky; top: 0; z-index: 40;
            display: flex; align-items: center; gap: 16px;
            padding: 16px clamp(16px, 4vw, 40px);
            background: linear-gradient(to bottom, var(--bg) 70%, transparent);
        }
        .wordmark {
            font-family: var(--font-display); font-weight: 800; font-size: 19px;
            letter-spacing: .2px; color: var(--ink);
            display: flex; align-items: center; gap: 6px;
        }
        .wordmark small { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--ink-faint); }
        .progress-track {
            flex: 1; height: 8px; border-radius: 99px; background-color: var(--bg-well);
            overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .08);
        }
        .progress-fill {
            height: 100%; width: 0%; border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width .5s cubic-bezier(.4, 0, .2, 1);
        }
        .step-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); min-width: 44px; text-align: right; }

        main {
            display: flex; align-items: center; justify-content: center;
            min-height: calc(100vh - 76px);
            padding: 24px clamp(16px, 4vw, 40px) 64px;
        }
        .stage { width: 100%; max-width: 640px; }
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow); padding: clamp(28px, 5vw, 44px);
            animation: riseIn .45s cubic-bezier(.16, 1, .3, 1);
            transition: background-color .08s ease, color .08s ease;
        }
        @keyframes riseIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

        .eyebrow {
            font-family: var(--font-mono); font-size: 12px; color: var(--accent);
            margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
        }
        h1 { font-family: var(--font-display); font-weight: 800; line-height: 1.08; margin: 0 0 14px; font-size: clamp(30px, 6vw, 44px); }
        h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0 0 14px; font-size: clamp(22px, 4.5vw, 30px); }
        p { line-height: 1.65; color: var(--ink-soft); margin: 0 0 16px; font-size: 15.5px; }
        .lede { font-size: 17px; color: var(--ink-soft); }

        .icon-badge {
            width: 60px; height: 60px; border-radius: 20px; background-color: var(--accent-soft);
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            margin-bottom: 18px;
        }

        .btn {
            font-family: var(--font-display); font-weight: 700; font-size: 16px;
            border: none; border-radius: var(--radius-md); cursor: pointer;
            padding: 16px 26px; width: 100%; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.98); }
        .btn:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
        .btn-primary {
            background-color: var(--accent); color: var(--accent-ink);
            box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--accent) 70%, transparent);
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background-color: var(--bg-well); color: var(--ink); }
        .btn-ghost {
            background: none; color: var(--ink-faint); font-family: var(--font-body); font-weight: 600;
            font-size: 13px; width: auto; padding: 10px 4px; text-decoration: underline; text-underline-offset: 3px;
        }
        .btn-ghost:hover { color: var(--ink-soft); }
        .row-actions { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 22px; }

        .options { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 4px; }
        .option {
            text-align: left; padding: 15px 18px; border-radius: var(--radius-sm);
            border: 2px solid var(--line); background-color: var(--bg-card); color: var(--ink);
            font-family: var(--font-body); font-weight: 600; font-size: 15px; cursor: pointer;
            transition: all .15s ease;
        }
        .option:hover { border-color: var(--accent); transform: translateX(2px); }
        .option:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
        .option.selected { border-color: var(--accent); background-color: var(--accent-soft); }
        .option.disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; pointer-events: none; }

        input[type=text], input[type=date], input[type=email] {
            width: 100%; font-family: var(--font-body); font-size: 16px; padding: 15px 16px;
            border-radius: var(--radius-sm); border: 2px solid var(--line); background-color: var(--bg-card);
            color: var(--ink); margin: 12px 0 6px;
        }
        input[type=text]:focus, input[type=date]:focus, input[type=email]:focus { outline: none; border-color: var(--accent); }
        input[type=text].invalid, input[type=date].invalid, input[type=email].invalid { border-color: #c00; }
        .field-error {
            font-size: 12px; color: #c00; margin: 0 0 6px;
            font-family: var(--font-mono); display: none;
        }
        .field-error.visible { display: block; }

        .tos-box {
            max-height: 280px; overflow-y: auto; background-color: var(--bg-well);
            border: 1px solid var(--line); border-radius: var(--radius-sm);
            padding: 18px 20px; margin: 18px 0 16px; font-size: 13px; line-height: 1.7;
            color: var(--ink-soft);
        }
        .tos-box h3 { font-size: 13px; margin: 14px 0 4px; color: var(--ink); font-family: var(--font-body); }
        .tos-box h3:first-child { margin-top: 0; }
        .tos-box p { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); }
        .check-row { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 4px; cursor: pointer; }
        .check-row input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
        .check-row span { font-size: 14px; color: var(--ink); line-height: 1.5; }

        .guilt {
            margin-top: 16px; padding: 16px; border-radius: var(--radius-sm);
            background-color: var(--accent-soft); font-size: 14px; color: var(--ink);
        }
        .guilt .row-actions { margin-top: 14px; }

        .coord-readout {
            font-family: var(--font-mono); font-size: 14px; background-color: var(--bg-well);
            border-radius: var(--radius-sm); padding: 16px 18px; margin: 18px 0; color: var(--ink);
        }
        .coord-readout .dim { color: var(--ink-faint); font-size: 11px; letter-spacing: .4px; }
        .pulse-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent);
            margin-right: 8px; animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

        .status-line {
            display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-soft);
            margin: 16px 0 -4px; font-family: var(--font-mono);
        }

        .glitching { animation: glitchScreen .6s steps(2, end); }
        @keyframes glitchScreen {
            0% { filter: none; }
            20% { filter: hue-rotate(30deg) saturate(3); transform: translateX(-2px); }
            40% { filter: invert(.1); transform: translateX(2px); }
            60% { filter: hue-rotate(-20deg); transform: translateX(-1px); }
            80% { filter: none; transform: translateX(1px); }
            100% { filter: none; transform: none; }
        }

        .blob-field { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .5; animation: float 7s ease-in-out infinite; }
        .blob.a { width: 220px; height: 220px; background-color: var(--accent-soft); top: -60px; right: -60px; }
        .blob.b { width: 160px; height: 160px; background-color: #FFF3D6; bottom: 10%; left: -50px; animation-delay: -3s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

        .warn-banner {
            max-width: 560px; margin: 0 auto; padding: 10px 16px; border-radius: var(--radius-sm);
            background-color: var(--bg-well); color: var(--ink-soft); font-size: 12.5px; text-align: center;
            display: none;
        }

        .loading-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; min-height: 320px; padding: 60px 32px;
            transition: background-color .08s ease, box-shadow .08s ease;
            position: relative; overflow: hidden;
        }
        .load-msg {
            font-family: var(--font-mono); font-weight: 600; font-size: 18px; letter-spacing: .3px;
            color: var(--ink); margin-bottom: 32px; min-height: 52px;
            transition: color .08s ease, text-shadow .08s ease;
        }
        .load-bar-track {
            width: 100%; height: 10px; border-radius: 99px; background-color: var(--bg-well);
            overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .15);
            transition: background-color .08s ease;
        }
        .load-bar-fill {
            height: 100%; width: 0%; border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width .1s linear, background .08s ease;
        }
        .load-pct {
            font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint); margin-top: 12px;
            transition: color .08s ease;
        }

        .loading-card.horror { background-color: #0A0006; box-shadow: inset 0 0 60px rgba(255, 59, 59, .25); }
        .loading-card.horror::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background: repeating-linear-gradient(to bottom, rgba(255, 0, 0, .05) 0px, rgba(255, 0, 0, .05) 1px, transparent 2px, transparent 4px);
            mix-blend-mode: overlay; animation: scanlines 8s linear infinite;
        }
        .loading-card.horror .load-msg { color: #FF2222; text-shadow: 0 0 10px rgba(255, 34, 34, .75), 0 0 2px rgba(255, 34, 34, .9); }
        .loading-card.horror .load-bar-track { background-color: #1a0507; }
        .loading-card.horror .load-bar-fill { background: #FF2222; }
        .loading-card.horror .load-pct { color: #B33; }
        @keyframes scanlines { 0% { background-position: 0 0; } 100% { background-position: 0 200px; } }

        .glitch-hard { animation: glitchHard .1s steps(2, end) infinite; }
        @keyframes glitchHard {
            0% { transform: translate(0, 0); filter: none; }
            20% { transform: translate(-4px, 3px); filter: hue-rotate(40deg) saturate(4) contrast(1.5); }
            40% { transform: translate(4px, -3px); filter: invert(.15) saturate(3); }
            60% { transform: translate(-3px, -3px) skewX(2deg); filter: hue-rotate(-30deg) contrast(1.4); }
            80% { transform: translate(3px, 3px) skewX(-2deg); filter: contrast(1.7); }
            100% { transform: translate(0, 0); filter: none; }
        }

        .toggle-list { margin: 18px 0 12px; }
        .toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid var(--line); gap: 12px;
        }
        .toggle:last-child { border-bottom: none; }
        .toggle-info { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.4; flex: 1; }
        .toggle-info b { color: var(--ink); font-weight: 600; }
        .toggle-info span { color: var(--ink-soft); font-size: 12px; }
        .toggle-info .always-on { font-size: 10px; color: var(--accent-2); font-weight: 400; margin-left: 4px; }
        .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .track {
            position: absolute; cursor: pointer; inset: 0; background-color: var(--line);
            border-radius: 99px; transition: background-color .2s ease;
        }
        .switch .track::after {
            content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; border-radius: 50%; transition: transform .2s ease;
        }
        .switch input:checked+.track { background-color: var(--accent); }
        .switch input:checked+.track::after { transform: translateX(18px); }
        .switch input:disabled+.track { opacity: .6; }
        .switch input:disabled+.track::after { background-color: #ddd; }

        .sub-greeting {
            font-size: 14px; color: var(--ink-soft); margin: 0 0 6px;
            opacity: 0; transform: translateY(6px);
            transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
        }
        .sub-greeting.visible { opacity: 1; transform: translateY(0); }

        .flash-invert { animation: flashInvert 0.1s steps(1, end); }
        @keyframes flashInvert {
            0% { filter: invert(1); }
            100% { filter: none; }
        }
        .screen-shake { animation: screenShake 0.08s linear infinite; }
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        .flash-message {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background-color: #0A0006; color: #FF2222;
            font-family: var(--font-mono); font-weight: 700; font-size: clamp(24px, 6vw, 48px);
            text-align: center; padding: 40px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.08s ease;
        }
        .flash-message.visible { opacity: 1; }
        .flash-message .repeat {
            position: absolute; white-space: nowrap;
            font-size: clamp(14px, 2.5vw, 22px); opacity: .7;
        }

        .countdown {
            font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint);
            text-align: right; margin: 12px 0 0;
        }
        .countdown.urgent { color: #FF2222; font-weight: 700; animation: pulse 0.5s ease-in-out infinite; }

        .persona-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
        .persona-name {
            font-family: var(--font-display); font-weight: 800;
            font-size: clamp(28px, 6vw, 40px); margin: 0 0 8px;
        }
        .persona-quote {
            font-style: italic; color: var(--ink-soft); font-size: 16px; margin: 0 0 20px;
            line-height: 1.55;
        }
        .persona-desc {
            font-size: 15.5px; line-height: 1.7; color: var(--ink-soft);
            margin: 0 0 18px;
        }
        .hidden-whisper {
            display: block; opacity: 0.35; font-size: 13px;
            font-style: italic; margin-top: 4px;
            transition: opacity 2s ease;
        }
        .hidden-whisper.show { opacity: 0.7; }

        .trap-modal {
            position: fixed; inset: 0; z-index: 9998;
            background-color: rgba(10, 0, 6, 0.92);
            display: none; align-items: center; justify-content: center;
            padding: 24px;
            animation: riseIn .3s ease;
        }
        .trap-modal.visible { display: flex; }
        .trap-box {
            background-color: #0A0006; color: #FF2222;
            border: 2px solid #FF2222;
            border-radius: 16px; padding: 32px 28px;
            max-width: 420px; width: 100%; text-align: center;
            font-family: var(--font-mono);
            box-shadow: 0 0 40px rgba(255, 34, 34, .4);
        }
        .trap-box h3 { font-size: 20px; margin: 0 0 12px; color: #FF2222; font-family: var(--font-mono); }
        .trap-box p { color: #FF2222; font-size: 14px; margin: 0 0 20px; font-family: var(--font-mono); }
        .trap-box .btn { background-color: #FF2222; color: #0A0006; font-family: var(--font-display); margin-top: 8px; }
        .trap-box .btn:hover { background-color: #FF4444; }

        .true-ending {
            background-color: #0A0006 !important;
            color: #FF2222;
            font-family: var(--font-mono);
            border: 2px solid #FF2222;
        }
        .true-ending h1 { color: #FF2222; font-family: var(--font-mono); font-weight: 700; }
        .true-ending h2 { color: #FF2222; font-family: var(--font-mono); }
        .true-ending p { color: #FF6666; font-family: var(--font-mono); }
        .true-ending .data-list {
            list-style: none; padding: 0; margin: 18px 0;
            font-size: 13.5px; line-height: 1.9;
        }
        .true-ending .data-list li {
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 59, 59, .3);
        }
        .true-ending .data-list li::before { content: '▸ '; color: #FF2222; }
        .true-ending .emphasis {

            function handleSpecial(q, idx, opt, card, finishQuestion) {
                var proceed = function() { finishQuestion(); };

                    }, 3000);

            function startQ7xCountdown(q, card, countdownEl, finishQuestion) {
                var totalMs = 10000;
                var startTime = Date.now();
                var autoSelected = false;

                countdownEl.classList.add('urgent');
                startTinnitus(0.05);

                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        document.body.classList.add('q7x-slow-dark');
                        card.classList.add('q7x-slow-dark');
                    });
                });

                function tick() {
                    if (autoSelected) return;
                    var elapsed = Date.now() - startTime;
                    var remaining = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));

                    countdownEl.textContent = 'Auto-selecting option C in ' + remaining + 's\u2026';
                    if (remaining <= 3) countdownEl.classList.add('urgent');

                    if (elapsed >= totalMs) {
                        autoSelected = true;
                        card._q7xRaf = null;
                        countdownEl.textContent = '';
                        countdownEl.classList.remove('urgent');
                        state.answers[q.id] = q.options[2];
                        state.scores.C += 1;
                        document.body.classList.remove('q7x-slow-dark');
                        card.classList.remove('q7x-slow-dark');
                        card.classList.add('flash-invert');
                        setTimeout(function() {
                            card.classList.remove('flash-invert');
                            finishQuestion();
                        }, 250);
                        return;
                    }
                    card._q7xRaf = requestAnimationFrame(tick);
                }
                card._q7xRaf = requestAnimationFrame(tick);
            }

            function computeFingerprint() {
                var fp = {};
                try { fp.browser = navigator.userAgent.split(') ')[0].split('(')[1] || navigator.platform; } catch(e){ fp.browser = 'unknown'; }
                try { fp.platform = navigator.platform || 'unknown'; } catch(e){ fp.platform = 'unknown'; }
                try { fp.language = navigator.language || 'unknown'; } catch(e){ fp.language = 'unknown'; }
                try { fp.screen = screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio||1) + 'x'; } catch(e){ fp.screen = 'unknown'; }
                try { fp.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ fp.timezone = 'unknown'; }
                try { fp.cores = navigator.hardwareConcurrency || 'unknown'; } catch(e){ fp.cores = 'unknown'; }
                try { fp.memory = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'not reported'; } catch(e){ fp.memory = 'not reported'; }
                try { fp.connection = (navigator.connection && navigator.connection.effectiveType) || 'not reported'; } catch(e){ fp.connection = 'not reported'; }
                return fp;
            }

                playNoiseBurst(1.5, 0.3);
                setTimeout(function() {
                    var personal = state.collected.personal || {};
                    var name = personal.name || '[redacted]';
                    var email = personal.email || '[redacted]';
                    var birthday = personal.birthday || '[redacted]';
                    var loc = state.collected.location;
                    var locStr;
                    if (loc && typeof loc === 'object' && loc.lat) locStr = loc.lat + '°, ' + loc.lng + '°';
                    else locStr = '[redacted]';
                    var fp = state.collected.fingerprint || {};

                    stage.innerHTML =
                        '<div class="card true-ending" id="trueCard">' +
                        '<div class="reveal-tag" style="color:#FF2222; font-family:var(--font-mono); font-size:12px; letter-spacing:.5px; margin-bottom:8px;">● FINAL TRANSMISSION</div>' +
                        '<h1 style="font-size:clamp(24px,5vw,34px);">Hello, ' + escapeHtml(name) + '.</h1>' +
                        '<p style="font-size:15px;">We\'re glad to hear from you.</p>' +
                        '<p>We\'ve received everything you shared with us over the last few minutes:</p>' +
                        '<ul class="data-list">' +
                        '<li>Name: ' + escapeHtml(name) + '</li>' +
                        '<li>Birthday: ' + escapeHtml(birthday) + '</li>' +
                        '<li>Email: ' + escapeHtml(email) + '</li>' +
                        '<li>Location: ' + escapeHtml(locStr) + '</li>' +
                        '<li>Browser: ' + escapeHtml(fp.browser || 'unknown') + '</li>' +
                        '<li>Platform: ' + escapeHtml(fp.platform || 'unknown') + '</li>' +
                        '<li>Screen: ' + escapeHtml(fp.screen || 'unknown') + '</li>' +
                        '<li>Timezone: ' + escapeHtml(fp.timezone || 'unknown') + '</li>' +
                        '<li>CPU cores: ' + escapeHtml(fp.cores || 'unknown') + '</li>' +
                        '<li>Memory: ' + escapeHtml(fp.memory || 'unknown') + '</li>' +
                        '<li>Connection: ' + escapeHtml(fp.connection || 'unknown') + '</li>' +
                        '</ul>' +
                        '<p>After careful cross-analysis with our biological research partners, our system has identified you as a <strong style="color:#FF2222;">suitable organ donor candidate</strong>.</p>' +
                        '<p>We thank you for your participation. A representative will be dispatched to collect the relevant organs shortly.</p>' +
                        '<p class="emphasis">Thank you for your cooperation.</p>' +
                        '<div class="row-actions">' +
                        '<button class="btn btn-primary" id="trueNextBtn" style="background-color:#FF2222; color:#0A0006;">Wait what?</button>' +
                        '</div>' +
                        '</div>';
                    document.getElementById('trueNextBtn').onclick = function() { goToStep('game'); };
                }, 1800);
            }

            function renderGame() {
                stage.innerHTML =
                    '<div class="card true-ending" id="gameCard">' +
                    '<div class="reveal-tag" style="color:#FF2222; font-family:var(--font-mono); font-size:12px; letter-spacing:.5px; margin-bottom:8px;">● SESSION STILL ACTIVE</div>' +
                    '<h2 style="font-family:var(--font-mono);">You may attempt to leave.</h2>' +
                    '<p style="font-family:var(--font-mono); font-size:14px;">Select an option below. All selections have been pre-approved and recorded.</p>' +
                    '<div class="game-buttons">' +
                    '<button class="option" data-game="1">I didn\u2019t consent to give you anything??</button>' +
                    '<button class="option" data-game="2">I\u2019m quitting</button>' +
                    '<button class="option" data-game="3">I don\u2019t want to</button>' +
                    '</div>' +
                    '<div id="section4Zone"></div>' +
                    '</div>';

                var gameState = { clicks: 0, sequenceStarted: false };
                var buttons = stage.querySelectorAll('[data-game]');
                for (var i = 0; i < buttons.length; i++) {
                    buttons[i].onclick = function() { handleGameClick(gameState); };
                }
            }

            function handleGameClick(gameState) {
                gameState.clicks++;
                playErrorBuzz(gameState.clicks);

                var prob = Math.min(0.9, 0.2 + gameState.clicks * 0.15);
                var delay = 180 + Math.random() * 350;
                setTimeout(function() {
                    if (Math.random() < prob) {
                        flashScreenRepeat('They\u2019re coming', 30, 700);
                        playNoiseBurst(0.4, 0.25);
                    }
                }, delay);

                var zone = document.getElementById('section4Zone');
                if (zone) {
                    zone.innerHTML =
                        '<div class="section4-reveal visible">' +
                        '<strong>Section 4: How We Use Camera, Microphone, Location &amp; Profile Data</strong><br><br>' +
                        '"...by continuing, you acknowledge that your data may be transferred to a biological research company for reference, and may be summoned if necessary. <strong>Once submitted, this consent is irrevocable and cannot be withdrawn by any means available to you.</strong>"<br><br>' +
                        'You have already authorized this. There is no option to withdraw.' +
                        '</div>';
                }

                if (!gameState.sequenceStarted) {
                    gameState.sequenceStarted = true;
                    setTimeout(function() {
                        playDoorCreak();
                        playFootstepsSequence(8, 0.18);
                    }, 1500);
                    setTimeout(function() {
                        blackOverlay.classList.add('visible');
                        playNoiseBurst(1.2, 0.3);
                    }, 6500);
                    setTimeout(function() {
                        stopTinnitus();
                        goToStep('final');
                    }, 8000);
                } else {
                    var extraSteps = Math.min(6, gameState.clicks);
                    for (var i = 0; i < extraSteps; i++) {
                        (function(i) {
                            setTimeout(function() { playFootstep(0.2 + i * 0.03); }, i * 180);
                        })(i);
                    }
                }
            }

            function renderFinal() {
                blackOverlay.classList.remove('visible');
                document.body.classList.remove('cold', 'dark-screen', 'q7x-slow-dark', 'loading-dark', 'true-ending-dark');
                stopTinnitus();

                stage.innerHTML =
                    '<div class="card final-page">' +
                    '<div class="icon-badge" style="background-color:var(--accent-soft); margin:0 auto 18px;">🎬</div>' +
                    '<h2>Thanks for playing.</h2>' +
                    '<p style="font-size:15.5px;">You\'ve reached the end of Persona Test. We hope you enjoyed the quiz.</p>' +
                    '<div class="disclaimer">' +
                    '<strong>Disclaimer:</strong> This is a satirical media art project. No data was actually collected, stored, or transferred. No organs will be harvested. Probably.' +
                    '</div>' +
                    '<div class="row-actions">' +
                    '<button class="btn btn-primary" id="finalRestart">Play again</button>' +
                    '</div>' +
                    '</div>';

                document.getElementById('finalRestart').onclick = function() {
                    stopTinnitus();
                    state = {
                        step: 0, consented: false, answers: {}, scores: { A: 0, B: 0, C: 0, D: 0 },
                        collected: { personal: null, location: null, camera: null, notifications: null, fingerprint: null, cookies: null }
                    };
                    qIndex = 0;
                    document.body.classList.remove('cold', 'dark-screen', 'q7x-slow-dark', 'loading-dark', 'true-ending-dark');
                    document.body.style.filter = '';
                    blackOverlay.classList.remove('visible');
                    render();
                };
            }

            render();
        })();
    </script>
</body>
</html>
